<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลดไขมัน 18 วัน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>แผนลดไขมัน 18 วัน</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2a33;--mu:#5d6b75;--ac:#1f6f8b;--ok:#2e9e5b;--bd:#dfe4e8;--wn:#c77d00;--hd:#fff;--fill:#e6ebef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--card:#18222a;--tx:#e8eef2;--mu:#9aa9b3;--ac:#5bb6d4;--ok:#4cc380;--bd:#2a3944;--wn:#f0b43c;--hd:#121b21;--fill:#26333d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1519;--card:#18222a;--tx:#e8eef2;--mu:#9aa9b3;--ac:#5bb6d4;--ok:#4cc380;--bd:#2a3944;--wn:#f0b43c;--hd:#121b21;--fill:#26333d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hd);border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 4px}
.top b{font-size:17px}#sub{color:var(--mu);font-size:13px;text-align:right}
#days{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
#days button{flex:0 0 auto;width:42px;height:50px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:700;position:relative;cursor:pointer}
#days small{display:block;font-size:11px;font-weight:400;color:var(--mu)}
#days .on{background:var(--ac);border-color:var(--ac);color:#fff}#days .on small{color:#fff}
#days .dn::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
#tabs{display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);padding:9px 0;font:inherit;font-weight:600;cursor:pointer}
#tabs .on{color:var(--ac);border-color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.bar{margin:7px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:13px}
.bar i{display:block;height:8px;border-radius:5px;background:var(--fill);overflow:hidden;margin-top:3px}
.bar u{display:block;height:100%;background:var(--ac);border-radius:5px;text-decoration:none}
.bar.w u{background:var(--wn)}.bar.k u{background:var(--ok)}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.it input,.ex input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--ok)}
.it span{flex:1}.it small{color:var(--mu);display:block;font-size:12px}.it b{white-space:nowrap}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.mh button,.btn{border:1px solid var(--bd);background:var(--fill);color:var(--tx);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.ex{padding:9px 0;border-top:1px solid var(--bd);display:grid;grid-template-columns:1fr 84px;gap:2px 10px;align-items:center}
.ex label{display:flex;gap:10px;align-items:center;font-weight:600}.ex div{color:var(--mu);font-size:13px;padding-left:32px}
.num,.f input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ex .num{grid-row:1/3;grid-column:2}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:13px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}p{margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-top:1px solid var(--bd);text-align:left}
tr.on td{background:var(--fill);font-weight:600}
.big{font-size:20px;font-weight:700;color:var(--ac)}
</style>
</head>
<body>
<header>
<div class="top"><b>แผนลดไขมัน 18 วัน</b><span id="sub"></span></div>
<nav id="days"></nav>
<div id="tabs"><button data-t="f">อาหาร</button><button data-t="w">เวท</button><button data-t="c">เดินชัน</button><button data-t="m">ติดตาม</button></div>
</header>
<main id="v"></main>
<script>
const FD=[["อกไก่ (ดิบ)",23,0,1.9],["เนื้อวัวสันใน (ดิบ)",21,0,4.5],["ไข่ทั้งฟอง",12.6,.7,9.5],["ไข่ขาว",10.9,.7,.2],["ข้าวสวย (สุก)",2.7,28.2,.3],["ผักใบเขียว (ดิบ)",1.4,2.9,.2],["น้ำมันมะกอก",0,0,100]];
const CH=0,BF=1,EG=2,EW=3,RC=4,VG=5,OL=6;
const WD=["อา","จ","อ","พ","พฤ","ศ","ส"];
const S0=new Date(2026,10,2);
const TY="LLRLLRHLLRLLRHLLRL";
const TN={L:"วันเวท",R:"วันไม่เวท",H:"วันคาร์บสูง"};
const T={1:{L:[140,135,45],R:[140,90,55],H:[140,140,55]},2:{L:[145,125,42],R:[145,85,55],H:[145,135,55]}};
const LIFT=["A","B","","A","B","","","A","B","","A","B","","","A","B","","A"];
const CARD={2:"z30",3:"z30",6:"z30",9:"z40",10:"z40",12:"z40",13:"i",15:"z45",17:"i",18:"z45"};
const CD={z30:["Zone 2",30,"5.0 km/h","ชัน 8-10%"],z40:["Zone 2",40,"5.0-5.5 km/h","ชัน 10-12%"],z45:["Zone 2",45,"5.0-5.5 km/h","ชัน 12%"],i:["อินเทอร์วัล",34,"เร็ว 6.0-6.5 / เบา 4.5 km/h","เร็ว ชัน 10-12% / เบา ชัน 5%"]};
const WA=[["Hip thrust",4,"8-10","2 นาที"],["Romanian deadlift",3,"8-10","2 นาที"],["Bulgarian split squat",3,"8-10 /ข้าง","90 วิ"],["Leg press / Goblet squat",3,"10-12","90 วิ"],["ยกปลายเท้า (Calf raise)",3,"12-15","60 วิ"]];
const WB=[["Lat pulldown",4,"8-10","2 นาที"],["Dumbbell shoulder press",3,"8-10","2 นาที"],["Seated row",3,"8-10","90 วิ"],["Incline dumbbell press",3,"8-10","90 วิ"],["Lateral raise",3,"12-15","60 วิ"]];
const $=id=>document.getElementById(id);
let S={c:{},w:{},l:{},x:{},m:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("fl18")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("fl18",JSON.stringify(S))}catch(e){}};
const dt=d=>new Date(S0.getFullYear(),S0.getMonth(),S0.getDate()+d-1);
const today=Math.floor((new Date().setHours(0,0,0,0)-S0)/864e5)+1;
let D=Math.min(18,Math.max(1,today)),TB="f";
const tg=d=>T[d<=7?1:2][TY[d-1]];
const mac=(f,g)=>[g*FD[f][1]/100,g*FD[f][2]/100,g*FD[f][3]/100];
function meals(d){const t=TY[d-1],p=d<=7?1:2;let m;
if(t=="L"){const b=p==1?150:175,r=p==1?150:125;m=[[1,EG,100],[1,EW,100],[1,RC,150],[2,BF,b],[2,RC,150],[2,VG,100],[2,OL,5],[3,CH,125],[3,RC,r],[3,VG,100],[3,OL,5],[4,CH,125],[4,EG,100],[4,VG,100]];if(p==1)m.push([4,OL,5])}
else{const b=p==1?140:165,r=p==1?150:125;m=[[1,EG,150],[1,EW,100],[1,RC,150],[2,BF,b],[2,RC,r],[2,VG,100],[2,OL,10],[3,CH,125],[3,VG,100],[3,OL,5],[4,CH,125],[4,EG,100],[4,VG,100],[4,OL,5]];if(t=="H")m.push([3,RC,180])}
return m.sort((a,b)=>a[0]-b[0])}
const hint=(f,g)=>f==EG?` ≈ ${+(g/50).toFixed(1)} ฟอง`:f==EW?` ≈ ${Math.round(g/33)} ฟอง`:f==OL?` ≈ ${+(g/5).toFixed(1)} ช้อนชา`:"";
const done=d=>Object.keys(S.c).some(k=>k.startsWith(d+"-")&&S.c[k]);
const bar=(n,v,t,c)=>{const p=Math.min(100,v/t*100);return `<div class="bar ${c||""}"><div><span>${n}</span><span>${Math.round(v)} / ${t}</span></div><i><u style="width:${p}%"></u></i></div>`};

function vf(){const m=meals(D),t=tg(D);let e=[0,0,0];
m.forEach((r,i)=>{if(S.c[D+"-"+i]){const a=mac(r[1],r[2]);e[0]+=a[0];e[1]+=a[1];e[2]+=a[2]}});
const xk=+S.x[D]||0,kc=4*e[0]+4*e[1]+9*e[2]+xk,tk=4*t[0]+4*t[1]+9*t[2];
let h=`<div class="card"><h3>เป้าวันนี้ • ${TN[TY[D-1]]}</h3>${bar("พลังงาน (kcal)",kc,Math.round(tk),kc>tk*1.05?"w":"k")}${bar("โปรตีน (g)",e[0],t[0])}${bar("คาร์บ (g)",e[1],t[1])}${bar("ไขมัน (g)",e[2],t[2])}<p class="mu">ติ๊กรายการที่กินแล้ว ระบบรวมให้ ชั่งเนื้อ/ผักตอนดิบ ข้าวตอนสุก</p></div>`;
for(let n=1;n<=4;n++){h+=`<div class="card"><div class="mh"><h3>มื้อ ${n}</h3><button data-all="${n}">ติ๊กทั้งมื้อ</button></div>`;
m.forEach((r,i)=>{if(r[0]==n)h+=`<label class="it"><input type="checkbox" data-c="${i}" ${S.c[D+"-"+i]?"checked":""}><span>${FD[r[1]][0]}<small>${hint(r[1],r[2]).trim()}</small></span><b>${r[2]} g</b></label>`});h+="</div>"}
h+=`<div class="card"><h3>กินนอกแผน</h3><div class="f"><label>kcal เพิ่ม (ประมาณ)<input class="num" inputmode="numeric" data-x="1" value="${S.x[D]||""}"></label></div><p class="mu">นับเฉพาะแคลอรี ใช้กับของที่ไม่อยู่ในแผน ฐานอาหารเต็ม 129 รายการอยู่ในไฟล์ Excel</p></div>`;
return h}

function vw(){const L=LIFT[D-1];let h="";
if(!L)h=`<div class="card"><h3>วันนี้พักเวท</h3><p>เดินตามเป้าก้าว ยืดเหยียด นอนให้พอ</p></div>`;
else{const ex=L=="A"?WA:WB,s15=[3,3,3,2,2],it=D<=7?"เหลือแรง 2 ครั้ง (RIR 2)":D<=14?"เหลือแรง 1 ครั้ง (RIR 1) • ทำถึงเรปสูงสุดครบทุกเซ็ต → ครั้งหน้าเพิ่มน้ำหนัก 2.5-5%":"RIR 1 • ลดเซ็ต ~20% คงน้ำหนักเท่าสัปดาห์ 2";
h=`<div class="card"><h3>เวท ${L=="A"?"A (ล่าง/ก้น)":"B (บน)"}${D>=15?" • ลดเซ็ต":""}</h3><p class="mu">ความหนัก: ${it}<br>วอร์มอัพ 5-8 นาที ใส่น้ำหนักที่ยกในช่องขวา</p>`;
ex.forEach((e,i)=>{const k=D+"-"+i,s=D>=15?s15[i]:e[1];h+=`<div class="ex"><label><input type="checkbox" data-w="${k}" ${S.w[k]?"checked":""}>${e[0]}</label><div>${s} × ${e[2]} • พัก ${e[3]}</div><input class="num" inputmode="decimal" placeholder="กก." data-l="${k}" value="${S.l[k]||""}"></div>`});h+="</div>"}
if(CARD[D])h+=`<div class="card mu">วันนี้มีเดินชันด้วย → ดูแท็บ “เดินชัน”</div>`;
return h}

function vc(){const st=D<=7?10000:D<=14?12000:12500,c=CARD[D];let h="";
if(c){const x=CD[c];h=`<div class="card"><h3>เดินชันวันนี้ • ${x[0]}</h3><div class="big">${x[1]} นาที</div><p>ความเร็ว ${x[2]}<br>ความชัน ${x[3]}</p>${c=="i"?`<p class="mu">วอร์ม 5 นาที (4.0 km/h ชัน 3%) → 8 รอบ [1 นาทีเร็ว + 2 นาทีเบา] → คูลดาวน์ 5 นาที ช่วงเร็วหนัก ~8/10</p>`:`<p class="mu">วอร์ม/คูลดาวน์ 3-5 นาที (4.0 km/h ชัน 3%) รวมอยู่ในเวลา ไม่เกาะราว${LIFT[D-1]?" ทำหลังเวท":""}</p>`}<label class="it" style="border:0"><input type="checkbox" data-w="c${D}" ${S.w["c"+D]?"checked":""}><span>ทำแล้ว</span></label></div>`}
else h=`<div class="card"><h3>วันนี้ไม่มีเดินชัน</h3><p>เดินเบาๆ ให้ถึงเป้าก้าว</p></div>`;
h+=`<div class="card"><h3>เป้าก้าวเดินวันนี้</h3><div class="big">${st.toLocaleString("en-US")} ก้าว</div><p class="mu">Zone 2: หัวใจ 115-134 ครั้ง/นาที (คำนวณจากอายุ 28) คุยเป็นประโยคได้แต่ไม่ร้องเพลงไหว | อินเทอร์วัลช่วงเร็ว ≥ 154 | เข่า/น่องไม่ไหว ลดความชันก่อน</p></div><div class="card"><h3>ตารางเดินชันทั้งแผน</h3><table><tr><th>วัน</th><th>ชนิด</th><th>นาที</th><th>ความชัน</th></tr>`;
Object.keys(CARD).forEach(d=>{const x=CD[CARD[d]];h+=`<tr class="${d==D?"on":""}"><td>${d}</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[3].replace("ชัน ","")}</td></tr>`});
return h+"</table></div>"}

function vm(){const m=S.m[D]||{};
const f=(k,n,p)=>`<label>${n}<input inputmode="decimal" placeholder="${p}" data-m="${k}" value="${m[k]||""}"></label>`;
let h=`<div class="card"><h3>วัน ${D} • บันทึก</h3><div class="f">${f("w","น้ำหนักเช้า (กก.)","เช่น 58.6")}${f("s","ก้าวเดินจริง","เช่น 11000")}${f("c","รอบเอว (ซม.)","วัน 1, 7, 14, 18")}${f("h","รอบสะโพก (ซม.)","วัน 1, 7, 14, 18")}</div><p class="mu">ชั่งหลังเข้าห้องน้ำ ก่อนกิน ดูค่าเฉลี่ย 7 วันเป็นหลัก</p></div>`;
const ws=[];for(let d=1;d<=18;d++){const v=parseFloat((S.m[d]||{}).w);if(v)ws.push([d,v])}
let avg="-";const rc=ws.filter(x=>x[0]<=D&&x[0]>D-7);if(rc.length)avg=(rc.reduce((a,b)=>a+b[1],0)/rc.length).toFixed(2)+" กก.";
const cw=[];for(let d=1;d<=18;d++){const v=parseFloat((S.m[d]||{}).c);if(v)cw.push(v)}
h+=`<div class="card"><h3>สรุป</h3><p>ค่าเฉลี่ยน้ำหนัก 7 วัน (ถึงวัน ${D}): <b>${avg}</b></p>`;
if(ws.length>1){const a=ws[0][1],b=ws[ws.length-1][1];h+=`<p>น้ำหนัก: ${a} → ${b} กก. (${(b-a>0?"+":"")+(b-a).toFixed(1)})</p>`}
if(cw.length>1)h+=`<p>รอบเอว: ${cw[0]} → ${cw[cw.length-1]} ซม. (${(cw[cw.length-1]-cw[0]>0?"+":"")+(cw[cw.length-1]-cw[0]).toFixed(1)})</p>`;
h+=`<p class="mu">ถ้าสิ้นสัปดาห์ 1 น้ำหนักเฉลี่ยไม่ลด: เพิ่มก้าวเดิน +2,000/วันก่อน แล้วค่อยลดแคลอรีทีละ 100 (ไม่ต่ำกว่า ~1,350)</p></div>`;
if(ws.length){h+=`<div class="card"><h3>น้ำหนักรายวัน</h3><table>`;ws.forEach(x=>h+=`<tr><td>วัน ${x[0]}</td><td>${x[1]} กก.</td></tr>`);h+="</table></div>"}
return h}

function render(){
const x=dt(D);$("sub").textContent=`วัน ${D} • ${x.getDate()}/${x.getMonth()+1} • ${TN[TY[D-1]]}`;
$("days").innerHTML=[...Array(18)].map((_,i)=>{const d=i+1;return `<button data-d="${d}" class="${d==D?"on":""}${done(d)?" dn":""}"><small>${WD[dt(d).getDay()]}</small>${d}</button>`}).join("");
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==TB));
const act=document.activeElement,keep=act&&act.tagName=="INPUT"&&act.type!="checkbox";
if(!keep)$("v").innerHTML={f:vf,w:vw,c:vc,m:vm}[TB]();
const on=document.querySelector("#days .on");if(on&&!keep)on.scrollIntoView({inline:"center",block:"nearest"});
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-d],[data-t],[data-all]");if(!t)return;
if(t.dataset.d){D=+t.dataset.d;render();window.scrollTo(0,0)}
else if(t.dataset.t){TB=t.dataset.t;render();window.scrollTo(0,0)}
else{meals(D).forEach((r,i)=>{if(r[0]==+t.dataset.all)S.c[D+"-"+i]=true});save();render()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
if(d.c!==undefined){S.c[D+"-"+d.c]=t.checked;save();render()}
else if(d.w){S.w[d.w]=t.checked;save();render()}
else if(d.l){S.l[d.l]=t.value;save()}
else if(d.x){S.x[D]=t.value;save();document.activeElement.blur();render()}
else if(d.m){(S.m[D]=S.m[D]||{})[d.m]=t.value;save();document.activeElement.blur();render()}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
render();
</script>
</body>
</html>
